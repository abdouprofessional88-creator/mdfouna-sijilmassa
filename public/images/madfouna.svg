<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="المدفونة السجلماسة">
  <defs>
    <radialGradient id="mbg" cx="0.5" cy="0.3" r="1">
      <stop offset="0" stop-color="#3a3129"/><stop offset="1" stop-color="#14110d"/>
    </radialGradient>
    <radialGradient id="mbread" cx="0.5" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#f2c47e"/><stop offset="0.55" stop-color="#cf7f3c"/><stop offset="1" stop-color="#7a3f1c"/>
    </radialGradient>
    <pattern id="mweave" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="11" fill="none" stroke="#8a6a45" stroke-width="2" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#mbg)"/>
  <rect width="800" height="600" fill="url(#mweave)" opacity="0.25"/>
  <ellipse cx="400" cy="500" rx="300" ry="42" fill="#000" opacity="0.5"/>
  <!-- woven tray -->
  <ellipse cx="400" cy="470" rx="290" ry="80" fill="#a87c3e"/>
  <ellipse cx="400" cy="462" rx="290" ry="80" fill="#c9a06a"/>
  <ellipse cx="400" cy="462" rx="252" ry="66" fill="none" stroke="#7a5a2e" stroke-width="4" stroke-dasharray="14 8" opacity="0.7"/>
  <ellipse cx="400" cy="462" rx="200" ry="50" fill="none" stroke="#7a5a2e" stroke-width="3" stroke-dasharray="10 8" opacity="0.5"/>
