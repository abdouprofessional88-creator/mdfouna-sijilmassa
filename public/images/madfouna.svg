  <ellipse cx="400" cy="345" rx="80" ry="42" fill="#f6d493" opacity="0.7"/>
  <g fill="#5e2f14" opacity="0.5">
    <circle cx="300" cy="370" r="9"/><circle cx="350" cy="340" r="7"/><circle cx="410" cy="352" r="9"/>
    <circle cx="460" cy="380" r="7"/><circle cx="330" cy="405" r="8"/><circle cx="395" cy="410" r="9"/>
    <circle cx="480" cy="410" r="6"/><circle cx="275" cy="405" r="6"/><circle cx="440" cy="330" r="6"/>
  </g>
  <g fill="#f6d493" opacity="0.6">
    <circle cx="320" cy="350" r="3"/><circle cx="380" cy="330" r="3"/><circle cx="430" cy="365" r="3"/><circle cx="360" cy="390" r="3"/>
  </g>
  <!-- cut wedge showing filling -->
  <path d="M400,380 L520,430 Q470,470 400,470 Z" fill="#4e2c12"/>
  <path d="M408,392 L500,430 Q460,458 410,458 Z" fill="#8a5a2e"/>
  <circle cx="445" cy="432" r="6" fill="#3a2410"/><circle cx="462" cy="440" r="5" fill="#3a2410"/><circle cx="430" cy="444" r="5" fill="#3a2410"/>
