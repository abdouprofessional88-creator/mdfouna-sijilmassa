<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="قاعة مدفونة سجلماسة الحقيقية">
  <defs>
    <linearGradient id="kmural" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd0e8"/><stop offset="0.5" stop-color="#cfe3b0"/><stop offset="1" stop-color="#6f9a55"/>
    </linearGradient>
    <pattern id="kzellige" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#f2efe8"/>
      <path d="M0,9 L9,0 L18,9 L9,18 Z" fill="none" stroke="#1c1c1c" stroke-width="2"/>
      <circle cx="9" cy="9" r="2" fill="#1c1c1c"/>
    </pattern>
    <radialGradient id="kspot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8e2"/><stop offset="1" stop-color="#fff8e2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ceiling + big star -->
  <rect width="800" height="120" fill="#f6f2e8"/>
  <g transform="translate(400,58) scale(1.6)" fill="#c1272d" stroke="#2e6b34" stroke-width="3">
    <path d="M0,-27 L8,-8 L29,-8 L12,4 L19,25 L0,13 L-19,25 L-12,4 L-29,-8 L-8,-8 Z"/>
  </g>
  <circle cx="400" cy="58" r="70" fill="url(#kspot)" opacity="0.6"/>
  <g fill="#fff4cf"><circle cx="140" cy="52" r="10"/><circle cx="250" cy="80" r="7"/><circle cx="550" cy="80" r="7"/><circle cx="660" cy="52" r="10"/></g>
  <g fill="url(#kspot)" opacity="0.55"><circle cx="140" cy="52" r="36"/><circle cx="660" cy="52" r="36"/></g>
  <!-- hanging bulb -->
  <line x1="400" y1="86" x2="400" y2="112" stroke="#3a2a1c" stroke-width="3"/>
  <circle cx="400" cy="118" r="8" fill="#ffe9a8"/>

  <!-- back wall -->
  <rect y="120" width="800" height="270" fill="#e9dfc8"/>
  <!-- kasbah mural -->
  <rect x="150" y="140" width="380" height="200" fill="url(#kmural)"/>
  <path d="M150,280 L250,210 L320,250 L420,200 L530,280 Z" fill="#9a7350"/>
  <g fill="#c49a62">
    <rect x="300" y="230" width="60" height="50"/><rect x="292" y="220" width="12" height="60"/><rect x="356" y="220" width="12" height="60"/>
    <rect x="380" y="245" width="44" height="35"/>
  </g>
  <path d="M150,300 Q300,270 380,295 T530,290 L530,340 L150,340 Z" fill="#5f8a48"/>
  <path d="M330,300 Q360,320 400,318 T470,330" stroke="#4a7a9a" stroke-width="10" fill="none"/>
  <g stroke="#3a3a3a" stroke-width="2"><path d="M220,190 l6,-8 l6,8 M250,180 l6,-8 l6,8 M440,185 l6,-8 l6,8"/></g>
  <rect x="150" y="140" width="380" height="200" fill="none" stroke="#c6a15b" stroke-width="5"/>
  <!-- left mural strip -->
  <rect x="40" y="140" width="90" height="200" fill="#7fb2a0"/>
  <path d="M40,260 L85,200 L130,260 Z" fill="#5e4a2e"/>
  <!-- right decorative panel: plates -->
  <rect x="550" y="140" width="90" height="200" fill="#8a4a6a"/>
  <g fill="#e8dabd" stroke="#5e2a3a" stroke-width="2">
    <circle cx="575" cy="180" r="14"/><circle cx="610" cy="180" r="14"/><circle cx="592" cy="215" r="14"/>
    <circle cx="575" cy="250" r="14"/><circle cx="610" cy="250" r="14"/><circle cx="592" cy="285" r="14"/>
  </g>
  <!-- TV screen top right -->
  <rect x="656" y="132" width="120" height="70" fill="#101418"/>
  <rect x="662" y="138" width="108" height="58" fill="#7a2e14"/>
  <circle cx="700" cy="162" r="12" fill="#ff9a3c"/><circle cx="730" cy="172" r="9" fill="#ffd97a"/>

  <!-- service counter with zellige -->
  <rect x="150" y="340" width="300" height="52" fill="url(#kzellige)" stroke="#3a2a1c" stroke-width="3"/>
  <rect x="150" y="334" width="300" height="8" fill="#5e4a2e"/>
  <rect x="200" y="310" width="40" height="24" fill="#ddd5c2"/>
  <!-- yellow arched door -->
  <path d="M470,392 L470,300 Q470,268 502,268 Q534,268 534,300 L534,392 Z" fill="#d9a92e" stroke="#8a6a1e" stroke-width="4"/>
  <circle cx="524" cy="340" r="4" fill="#5e4a1e"/>
  <!-- white cabinet -->
  <rect x="560" y="340" width="80" height="52" fill="#f2efe8" stroke="#b9b0a0" stroke-width="2"/>
  <rect x="572" y="330" width="56" height="12" fill="#ddd5c2"/>

  <!-- floor -->
  <rect y="392" width="800" height="208" fill="#d8d2c0"/>

  <!-- green sofa back + blue tables -->
  <rect x="120" y="400" width="180" height="52" rx="8" fill="#3f7a34"/>
  <rect x="120" y="386" width="180" height="26" rx="8" fill="#4c8a3e"/>
  <rect x="330" y="410" width="90" height="60" fill="#2e9ab0"/>
  <rect x="330" y="404" width="90" height="10" fill="#cfe8ef"/>
  <rect x="440" y="420" width="70" height="50" fill="#2e9ab0"/>
  <rect x="180" y="452" width="60" height="14" fill="#6b4a26"/>

  <!-- yellow L banquettes -->
  <g>
    <rect x="60" y="440" width="240" height="80" rx="10" fill="#d9b92e"/>
    <rect x="60" y="424" width="240" height="28" rx="10" fill="#e8cf4e"/>
    <rect x="300" y="470" width="200" height="70" rx="10" fill="#d9b92e"/>
    <!-- yellow cushions + red cushion -->
    <rect x="90" y="446" width="52" height="52" rx="8" fill="#e8cf4e" stroke="#b89a1e" stroke-width="2"/>
    <rect x="330" y="476" width="52" height="52" rx="8" fill="#e8cf4e" stroke="#b89a1e" stroke-width="2"/>
    <rect x="392" y="476" width="52" height="52" rx="8" fill="#c1272d"/>
  </g>

  <!-- foreground red sofa -->
  <rect x="0" y="500" width="800" height="100" rx="14" fill="#a11f33"/>
  <rect x="0" y="492" width="800" height="24" rx="10" fill="#bd2f45"/>
  <rect x="470" y="452" width="120" height="70" rx="10" fill="#7a1526"/>
  <rect x="620" y="452" width="120" height="70" rx="10" fill="#7a1526"/>
</svg>
